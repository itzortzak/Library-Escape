name: Validate, release and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: library-escape-publication
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate build and room navigation
        run: |
          python3 scripts/build.py
          node scripts/navigation-check.cjs
      - name: Check complete game and persistence
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --directory dist > /tmp/library-server.log 2>&1 &
          node scripts/browser-check.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: library-escape
          path: dist/
          include-hidden-files: true
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: library-escape
          path: dist
      - name: Create versioned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
          else
            cp dist/index.html "Literary_Escape_Room_$tag.html"
            (cd dist && zip -q "../Library-Escape_$tag.zip" index.html catalogue.csv README.txt CHANGELOG.md VERSION SHA256SUMS VALIDATION.txt)
            gh release create "$tag" "Literary_Escape_Room_$tag.html" "Library-Escape_$tag.zip" --target "$GITHUB_SHA" --title "Library Escape 3D $tag" --notes-file CHANGELOG.md --prerelease
          fi
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      actions: read
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.first_deployment.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: library-escape
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 24); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[] | select(.expired == false) | .name' | grep -Fxq "$ARTIFACT_NAME"; then
              echo "Pages artifact is available."
              sleep 20
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact metadata did not become available."
          exit 1
      - id: first_deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before retry
        if: steps.first_deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment
        if: steps.first_deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
